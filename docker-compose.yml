# InfluxDB (guarda os eventos) + Grafana (mostra). Uso: docker compose up -d
# Grafana: http://localhost:3000 (admin / admin)
services:
  influxdb:
    image: influxdb:2.7.10
    ports: ["8086:8086"]
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: tinyml-senha
      DOCKER_INFLUXDB_INIT_ORG: tinyml
      DOCKER_INFLUXDB_INIT_BUCKET: telemetria
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: tinyml-token-local
    volumes: [influx-data:/var/lib/influxdb2]
  grafana:
    image: grafana/grafana:11.2.0
    ports: ["3000:3000"]
    depends_on: [influxdb]
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
volumes:
  influx-data:
  grafana-data:
